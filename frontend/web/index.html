<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#185740">
  <title>Paradise Gym | Quản lý phòng tập</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/devextreme-dist/23.2.5/css/dx.light.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/web.css?v=20">
</head>
<body class="dx-viewport is-booting">
  <div id="bootState" role="status">Đang kết nối Paradise Gym...</div>
  <div id="authView" hidden></div>
  <div id="appShell" hidden>
    <header id="topbar">
      <div class="topbar-left">
        <button class="icon-button" id="btnDrawerToggle" title="Đóng / mở điều hướng" aria-label="Đóng / mở điều hướng" aria-expanded="true"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
        <a href="#dashboard" class="brand-logo" aria-label="Paradise Gym - Tổng quan"><i class="fa-solid fa-dumbbell brand-mark" aria-hidden="true"></i><span>Paradise<span class="brand-gym">Gym</span><small>QUẢN LÝ PHÒNG TẬP</small></span></a>
      </div>
      <nav class="top-shortcuts" aria-label="Điều hướng nhanh" title="Điều hướng nhanh">
        <button class="icon-button" data-route="dashboard" title="Tổng quan" aria-label="Tổng quan"><i class="fa-solid fa-table-cells-large"></i></button>
        <button class="icon-button" data-route="members" title="Hội viên & khách hàng" aria-label="Hội viên & khách hàng"><i class="fa-solid fa-address-card"></i></button>
        <button class="icon-button" data-route="packages" title="Gói tập" aria-label="Gói tập"><i class="fa-solid fa-boxes-stacked"></i></button>
        <button class="icon-button" data-route="registrations" title="Đăng ký & gia hạn" aria-label="Đăng ký & gia hạn"><i class="fa-solid fa-file-signature"></i></button>
        <button class="icon-button" data-route="trainers" title="Huấn luyện viên" aria-label="Huấn luyện viên"><i class="fa-solid fa-dumbbell"></i></button>
        <button class="icon-button" data-route="pt-schedule" title="Lịch tập & buổi PT" aria-label="Lịch tập & buổi PT"><i class="fa-regular fa-calendar-days"></i></button>
        <button class="icon-button" data-route="community-classes" title="Lớp tập cộng đồng" aria-label="Lớp tập cộng đồng"><i class="fa-solid fa-users-rectangle"></i></button>
        <button class="icon-button" data-route="access-gate" title="Ra vào & check-in" aria-label="Ra vào & check-in"><i class="fa-solid fa-arrow-right-to-bracket"></i></button>
        <button class="icon-button" data-route="customer-care" title="Chăm sóc khách hàng" aria-label="Chăm sóc khách hàng"><i class="fa-solid fa-cake-candles"></i></button>
        <button class="icon-button" data-route="payments" title="Thu tiền & thanh toán" aria-label="Thu tiền & thanh toán"><i class="fa-solid fa-wallet"></i></button>
        <button class="icon-button" data-route="commissions" title="Hoa hồng PT" aria-label="Hoa hồng PT"><i class="fa-solid fa-hand-holding-dollar"></i></button>
        <button class="icon-button" data-route="discounts" title="Voucher & khuyến mãi" aria-label="Voucher & khuyến mãi"><i class="fa-solid fa-ticket"></i></button>
        <button class="icon-button" data-route="notifications" title="Thông báo" aria-label="Thông báo"><i class="fa-solid fa-bell"></i></button>
        <button class="icon-button" data-route="reports" title="Báo cáo" aria-label="Báo cáo"><i class="fa-solid fa-chart-column"></i></button>
        <button class="icon-button" data-route="branches" title="Chi nhánh" aria-label="Chi nhánh"><i class="fa-solid fa-building"></i></button>
        <button class="icon-button" data-route="equipment" title="Hệ thống & thiết bị" aria-label="Hệ thống & thiết bị"><i class="fa-solid fa-display"></i></button>
        <button class="icon-button" data-route="users-rbac" title="Tài khoản & phân quyền" aria-label="Tài khoản & phân quyền"><i class="fa-solid fa-user-shield"></i></button>
      </nav>
      <div class="topbar-right">
        <div class="branch-control"><i class="fa-solid fa-location-dot" aria-hidden="true"></i><div id="globalBranchSelector"></div></div>
        <button class="icon-button" data-route="notifications" title="Thông báo" aria-label="Thông báo"><i class="fa-regular fa-bell"></i></button>
        <div class="user-profile-badge"><span class="user-avatar" id="userAvatar"></span><span class="user-info"><strong id="userName"></strong><small id="userRole"></small></span></div>
        <button class="icon-button" id="btnLogout" title="Đăng xuất" aria-label="Đăng xuất"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
      </div>
    </header>
    <div id="workspace">
      <aside id="sidebar" aria-label="Điều hướng chính"><div class="sidebar-caption"><span>KHÔNG GIAN LÀM VIỆC</span><span id="sidebarRoleIndicator"></span></div><nav id="sidebarList"></nav><div class="sidebar-footer"><i class="fa-solid fa-dumbbell"></i><div><strong>Paradise Gym</strong><span id="scopeLabel"></span></div></div></aside>
      <div class="workspace-main"><div id="workspaceTabs" role="tablist" aria-label="Màn hình đang mở"></div><main id="mainViewport" tabindex="-1"></main><footer class="workspace-footer"><span>Paradise Gym</span><span id="workspaceScope"></span></footer></div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/devextreme-dist/23.2.5/js/dx.all.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/devextreme-dist/23.2.5/js/localization/dx.messages.vi.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
  <script src="../shared/apiClient.js"></script>
  <script src="js/ui.js?v=4"></script>
  <script src="js/modules/dashboard.js?v=2"></script>
  <script src="js/modules/reports.js?v=6"></script>
  <script src="js/modules/members.js?v=5"></script>
  <script src="js/modules/packages.js?v=4"></script>
  <script src="js/modules/sales.js?v=12"></script>
  <script src="js/modules/ptScheduler.js?v=20"></script>
  <script src="js/modules/checkin.js"></script>
  <script src="js/modules/system.js?v=7"></script>
  <script src="js/modules/customerCare.js?v=4"></script>
  <script src="js/modules/commissions.js?v=23"></script>
  <script src="js/modules/community.js?v=4"></script>
  <script src="js/modules/discounts.js?v=7"></script>
  <script src="js/app.js?v=8"></script>
</body>
</html>
