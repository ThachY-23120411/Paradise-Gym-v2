<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#185740" />
    <title>Paradise Gym | Hội viên</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn3.devexpress.com/jslib/23.2.5/css/dx.light.css"
    />
    <link rel="stylesheet" href="css/member.css?v=15" />
  </head>
  <body>
    <div id="memberApp">
      <header class="app-header" id="appHeader">
        <div class="header-left">
          <img style="display:none" 
               alt="Avatar Hội viên" 
               class="header-member-avatar" 
               id="headerAvatar">
          <div class="header-avatar-fallback" id="headerAvatarFallback" style="display:none">
            <i class="fa-solid fa-user"></i>
          </div>
          <div class="header-info">
            <div class="member-brand brand">PARADISE <b>GYM</b></div>
            <h2 id="headerMemberName">Xin chào, Hội viên</h2>
            <div class="header-subtitle" id="headerBranchName">
              <i class="fa-solid fa-location-dot"></i>
              <span id="headerBranchText">Paradise Gym Quận 1</span>
              <span class="header-dot-separator">•</span>
              <span class="header-member-code-badge" id="headerMemberCodeBadge">HV</span>
            </div>
          </div>
        </div>

        <div class="header-actions">
          <button
            id="btnHeaderNotifications"
            class="btn-icon-circle"
            title="Thông báo"
            aria-label="Thông báo"
            hidden
          >
            <i class="fa-solid fa-bell"></i>
            <span id="unreadBellDot" class="badge-dot-count" style="display:none;">0</span>
          </button>
          <button
            id="refreshPage"
            class="btn-icon-circle"
            title="Tải lại"
            aria-label="Tải lại"
            style="display:none;"
            hidden
          >
            <i class="fa-solid fa-rotate-right"></i>
          </button>
        </div>
      </header>
      <main id="main" tabindex="-1">
        <div class="state" role="status">Đang kết nối...</div>
      </main>
      <nav
        id="bottomNav"
        class="bottom-nav"
        aria-label="Điều hướng chính"
        hidden
      >
        <button data-route="home">
          <i class="fa-solid fa-house"></i><span>Trang chủ</span>
        </button>
        <button data-route="schedule">
          <i class="fa-regular fa-calendar"></i><span>Lịch tập</span>
        </button>
        <button data-route="packages">
          <i class="fa-solid fa-ticket"></i><span>Gói của tôi</span>
        </button>
        <button data-route="payments">
          <i class="fa-solid fa-credit-card"></i><span>Thanh toán</span>
        </button>
        <button data-route="account">
          <i class="fa-regular fa-user"></i><span>Tài khoản</span>
        </button>
      </nav>
    </div>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn3.devexpress.com/jslib/23.2.5/js/dx.all.js"></script>
    <script src="https://cdn3.devexpress.com/jslib/23.2.5/js/localization/dx.messages.vi.js"></script>
    <script src="../../shared/apiClient.js"></script>
    <script src="js/app.js?v=5"></script>
    <script src="js/auth-account.js?v=2"></script>
    <script src="js/home-schedule.js?v=11"></script>
    <script src="js/packages-notifications.js?v=13"></script>
  </body>
</html>
