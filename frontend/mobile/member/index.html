<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#185740" />
    <title>Paradise Gym | Hội viên</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn3.devexpress.com/jslib/23.2.5/css/dx.light.css"
    />
    <link rel="stylesheet" href="css/member.css" />
  </head>
  <body>
    <div id="memberApp">
      <header class="app-header">
        <a href="#home" class="brand" aria-label="Paradise Gym, trang chủ"
          ><i class="fa-solid fa-dumbbell" aria-hidden="true"></i
          ><span>PARADISE <b>GYM</b></span></a
        >
        <button
          id="refreshPage"
          class="icon-button"
          title="Tải lại"
          aria-label="Tải lại"
          hidden
        >
          <i class="fa-solid fa-rotate-right"></i>
        </button>
      </header>
      <main id="main" tabindex="-1">
        <div class="state" role="status">Đang kết nối...</div>
      </main>
      <nav
        id="bottomNav"
        class="bottom-nav"
        aria-label="Điều hướng chính"
        hidden
      >
        <button data-route="home">
          <i class="fa-solid fa-house"></i><span>Trang chủ</span>
        </button>
        <button data-route="schedule">
          <i class="fa-regular fa-calendar"></i><span>Lịch tập</span>
        </button>
        <button data-route="packages">
          <i class="fa-solid fa-ticket"></i><span>Gói của tôi</span>
        </button>
        <button data-route="notifications">
          <i class="fa-regular fa-bell"></i><span>Thông báo</span>
        </button>
        <button data-route="account">
          <i class="fa-regular fa-user"></i><span>Tài khoản</span>
        </button>
      </nav>
    </div>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn3.devexpress.com/jslib/23.2.5/js/dx.all.js"></script>
    <script src="https://cdn3.devexpress.com/jslib/23.2.5/js/localization/dx.messages.vi.js"></script>
    <script src="../../shared/apiClient.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth-account.js"></script>
    <script src="js/home-schedule.js"></script>
    <script src="js/packages-notifications.js"></script>
  </body>
</html>
