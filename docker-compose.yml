services:
  # 1. PostgreSQL Database Server 16-alpine
  postgres:
    image: postgres:16-alpine
    container_name: paradise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: paradise_gym
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - paradise_pgdata:/var/lib/postgresql/data
    networks:
      - paradise-net

  # 2. pgAdmin 4 Web UI Dashboard
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: paradise-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@paradisegym.vn
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "5050:80"
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - postgres
    networks:
      - paradise-net

volumes:
  paradise_pgdata:

networks:
  paradise-net:
    external: true
